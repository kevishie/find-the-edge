name: Diagnose Phase 1 ingestion

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  logs:
    name: Read recent ingestion failures
    if: github.repository == 'kevishie/find-the-edge' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Assume AWS deployment role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::228246988391:role/github-actions-find-the-edge-deploy
          aws-region: us-east-1

      - name: Read bounded recent Lambda diagnostics
        shell: bash
        run: |
          set -euo pipefail
          function_name="$(aws cloudformation describe-stacks \
            --stack-name FindTheEdge-dev-Foundation \
            --query "Stacks[0].Outputs[?OutputKey=='LiveOddsIngestionFunctionName'].OutputValue | [0]" \
            --output text)"
          log_group="/aws/lambda/${function_name}"
          start_time="$(( $(date +%s) - 3600 ))000"
          aws logs filter-log-events \
            --log-group-name "$log_group" \
            --start-time "$start_time" \
            --filter-pattern '{ ($.league = "mlb") || ($.league = "mls") || ($.event = "live-odds-ingestion-complete") }' \
            --query 'events[].message' \
            --output text \
            | tr '\t' '\n' \
            | tail -300

          api_function_name="$(aws lambda list-functions --output json \
            | jq -r '.Functions[] | select(.FunctionName | contains("EventApi")) | .FunctionName' \
            | head -1)"
          if [[ -n "$api_function_name" && "$api_function_name" != "None" ]]; then
            api_log_group="/aws/lambda/${api_function_name}"
            aws logs filter-log-events \
              --log-group-name "$api_log_group" \
              --start-time "$start_time" \
              --query 'events[].message' \
              --output text \
              | tr '\t' '\n' \
              | tail -300
          fi

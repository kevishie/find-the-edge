name: Deploy Phase 1

on:
  workflow_run:
    workflows: [Quality gates]
    types: [completed]
    branches: [main, production]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  target:
    name: Resolve protected deployment target
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      (github.event.workflow_run.head_branch == 'main' ||
      github.event.workflow_run.head_branch == 'production'))
    runs-on: ubuntu-latest
    outputs:
      branch: ${{ steps.target.outputs.branch }}
      github_environment: ${{ steps.target.outputs.github_environment }}
      product_access_enforced: ${{ steps.target.outputs.product_access_enforced }}
      sha: ${{ steps.target.outputs.sha }}
      stage: ${{ steps.target.outputs.stage }}
    steps:
      - id: target
        name: Bind branch to environment
        env:
          BRANCH: ${{ github.event.workflow_run.head_branch || github.ref_name }}
          VERIFIED_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          case "$BRANCH" in
            main)
              echo "stage=staging" >> "$GITHUB_OUTPUT"
              echo "github_environment=staging" >> "$GITHUB_OUTPUT"
              echo "product_access_enforced=false" >> "$GITHUB_OUTPUT"
              ;;
            production)
              echo "stage=prod" >> "$GITHUB_OUTPUT"
              echo "github_environment=production" >> "$GITHUB_OUTPUT"
              echo "product_access_enforced=false" >> "$GITHUB_OUTPUT"
              ;;
            *) exit 1 ;;
          esac
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "sha=$VERIFIED_SHA" >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy ${{ needs.target.outputs.github_environment }} and run live smoke
    needs: target
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ needs.target.outputs.github_environment }}
    concurrency:
      group: phase1-${{ needs.target.outputs.stage }}-environment
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Refuse to deploy an outdated branch revision
        env:
          BRANCH: ${{ needs.target.outputs.branch }}
          GH_TOKEN: ${{ github.token }}
          VERIFIED_SHA: ${{ needs.target.outputs.sha }}
        run: |
          latest_sha=$(gh api "repos/${{ github.repository }}/commits/$BRANCH" --jq .sha)
          test "$VERIFIED_SHA" = "$latest_sha"

      - name: Refuse premature product-access cutover
        env:
          FTE_PRODUCT_ACCESS_ENFORCED: ${{ needs.target.outputs.product_access_enforced }}
        run: test "$FTE_PRODUCT_ACCESS_ENFORCED" = "false"

      - name: Check out verified revision
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.target.outputs.sha }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.12"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Assume isolated AWS deployment role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      - name: Install environment SharpAPI credential
        env:
          FTE_AWS_STAGE: ${{ needs.target.outputs.stage }}
          SHARP_API_KEY: ${{ secrets.SHARP_API_KEY }}
        run: |
          test -n "$SHARP_API_KEY"
          secret_name="find-the-edge/$FTE_AWS_STAGE/sharpapi"
          secret_json=$(jq -cn --arg apiKey "$SHARP_API_KEY" '{apiKey:$apiKey}')
          if aws secretsmanager describe-secret --secret-id "$secret_name" >/dev/null 2>&1; then
            aws secretsmanager put-secret-value --secret-id "$secret_name" --secret-string "$secret_json" >/dev/null
          else
            aws secretsmanager create-secret --name "$secret_name" --secret-string "$secret_json" >/dev/null
          fi

      - name: Deploy and run environment smoke
        env:
          AWS_ACCOUNT_ID: "228246988391"
          AWS_REGION: us-east-1
          FTE_AWS_STAGE: ${{ needs.target.outputs.stage }}
          FTE_API_CERTIFICATE_ARN: ${{ vars.API_CERTIFICATE_ARN }}
          FTE_CRITICAL_ALARM_EMAIL: ${{ secrets.ALARM_EMAIL }}
          FTE_DEPLOY_BRANCH: ${{ needs.target.outputs.branch }}
          FTE_EVENT_CURSOR_SECRET_ARN: ${{ vars.EVENT_CURSOR_SECRET_ARN }}
          FTE_PHASE1_LAUNCH: "1"
          FTE_PRODUCT_ACCESS_ENFORCED: ${{ needs.target.outputs.product_access_enforced }}
          FTE_RELEASE_SHA: ${{ needs.target.outputs.sha }}
          FTE_WEB_CERTIFICATE_ARN: ${{ vars.WEB_CERTIFICATE_ARN }}
        run: pnpm phase1:launch

      - name: Verify live product-access setting
        env:
          FTE_AWS_STAGE: ${{ needs.target.outputs.stage }}
        run: |
          stack="FindTheEdge-$FTE_AWS_STAGE-Foundation"
          api_id=$(aws cloudformation describe-stacks --stack-name "$stack" --region us-east-1 --output json | jq -er '.Stacks[0].Outputs | map(select(.OutputKey == "EventsApiId")) | if length == 1 then .[0].OutputValue else error("events-api-binding") end')
          target=$(aws apigatewayv2 get-routes --api-id "$api_id" --region us-east-1 --output json | jq -er '.Items | map(select(.RouteKey == "GET /auth/session/capabilities")) | if length == 1 then .[0].Target else error("capability-route-binding") end')
          integration_id=${target#integrations/}
          test "$integration_id" != "$target"
          integration_uri=$(aws apigatewayv2 get-integration --api-id "$api_id" --integration-id "$integration_id" --region us-east-1 --query IntegrationUri --output text)
          [[ "$integration_uri" =~ ^arn:aws:lambda:us-east-1:228246988391:function:[A-Za-z0-9_-]+(:[A-Za-z0-9_-]+)?$ ]]
          test "$(aws lambda get-function-configuration --function-name "$integration_uri" --region us-east-1 --query 'Environment.Variables.FTE_PRODUCT_ACCESS_ENFORCED' --output text)" = false

name: Deploy Phase 1

on:
  workflow_run:
    workflows: [Quality gates]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: phase1-development-environment
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    name: Deploy and run live smoke
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Refuse to deploy an outdated main revision
        if: github.event_name == 'workflow_run'
        env:
          GH_TOKEN: ${{ github.token }}
          VERIFIED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          latest_sha=$(gh api repos/${{ github.repository }}/commits/main --jq .sha)
          test "$VERIFIED_SHA" = "$latest_sha"

      - name: Check out verified revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.12"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Assume AWS deployment role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::228246988391:role/github-actions-find-the-edge-deploy
          aws-region: us-east-1

      - name: Install SharpAPI credential in AWS Secrets Manager
        env:
          SHARP_API_KEY: ${{ secrets.SHARP_API_KEY }}
        run: |
          test -n "$SHARP_API_KEY"
          secret_json=$(jq -cn --arg apiKey "$SHARP_API_KEY" '{apiKey:$apiKey}')
          if aws secretsmanager describe-secret --secret-id find-the-edge/dev/sharpapi >/dev/null 2>&1; then
            aws secretsmanager put-secret-value --secret-id find-the-edge/dev/sharpapi --secret-string "$secret_json" >/dev/null
          else
            aws secretsmanager create-secret --name find-the-edge/dev/sharpapi --secret-string "$secret_json" >/dev/null
          fi

      - name: Deploy Phase 1 and run live smoke
        env:
          AWS_ACCOUNT_ID: "228246988391"
          AWS_REGION: us-east-1
          FTE_EVENT_CURSOR_SECRET_ARN: arn:aws:secretsmanager:us-east-1:228246988391:secret:find-the-edge/dev/event-cursor-signing-rI0Nea
          FTE_PHASE1_LAUNCH: "1"
        run: pnpm phase1:launch
